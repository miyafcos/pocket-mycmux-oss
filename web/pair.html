<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ポケットに PC を追加</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 32px 20px; }
    main { max-width: 28rem; margin: 10vh auto; }
    h1 { font-size: 1.7rem; overflow-wrap: anywhere; }
    p { line-height: 1.8; }
    a { display: block; padding: 16px; margin-top: 16px; text-align: center;
        border-radius: 12px; color: inherit; }
    .open { background: #215fda; color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #df9400; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>{{MACHINE}}</h1>
    <p>この PC をポケットに追加して、iPhone から開きます。</p>
    <a class="open" href="{{APP_LINK}}">ポケットで開く</a>
    <a href="{{BASE}}">ブラウザで開く (PWA)</a>
  </main>
</body>
</html>
