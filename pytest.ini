[pytest]
testpaths = tests
# _state holds runtime state and whatever a delegated run copied there to work
# on. A copy of a test file living under it collides with the real one by module
# name and stops the whole suite from being collected, which happened on
# 2026-09-08. Keep collection inside tests/ and name the directories that must
# never be walked.
norecursedirs = _state _dispatch _archive .git __pycache__ .pytest_cache node_modules
